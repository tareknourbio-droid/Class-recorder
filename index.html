<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>د. طارق نور | سجل الفصل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --ink:#E9EEF3;
    --muted:#8FA6BE;
    --paper:#0A1626;
    --paper-2:#122238;
    --card:#132A44;
    --field-bg:#0F2036;
    --teal:#081527;
    --teal-2:#173252;
    --gold:#D9A94E;
    --gold-2:#F4D58D;
    --accent:#7DD3E8;
    --gold-soft:rgba(217,169,78,0.16);
    --present:#2FD9A8;
    --present-soft:rgba(47,217,168,0.14);
    --late:#E0A63E;
    --late-soft:rgba(224,166,62,0.16);
    --absent:#E2604A;
    --absent-soft:rgba(226,96,74,0.16);
    --border:#25405C;
    --shadow: 0 6px 22px rgba(0,0,0,0.38);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:
      radial-gradient(650px circle at 92% -8%, rgba(79,168,224,0.14), transparent 60%),
      radial-gradient(550px circle at -8% 108%, rgba(217,169,78,0.10), transparent 60%),
      var(--paper);
    color:var(--ink);
    font-family:'Tajawal', sans-serif;
    min-height:100vh;
  }
  h1,h2,h3,.brand,.navlabel,.tabtitle{font-family:'Cairo', sans-serif;}

  .app{ display:flex; min-height:100vh; }
  .mobile-topbar{ display:none; }

  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .fade-in{ animation:fadeIn .28s ease; }

  .spinner{
    width:26px; height:26px; border-radius:50%;
    border:3px solid var(--border); border-top-color:var(--gold);
    animation:spin .7s linear infinite; margin:0 auto 12px;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .btn:active{ transform:scale(0.97); }
  .stamp:active{ transform:scale(0.94); }

  /* sidebar */
  .sidebar{
    width:220px; flex-shrink:0;
    background:linear-gradient(165deg, var(--teal), var(--teal-2) 70%);
    color:#F5F2EA;
    display:flex; flex-direction:column;
    padding:22px 14px;
    position:sticky; top:0; height:100vh;
    box-shadow: 3px 0 14px rgba(22,56,50,0.12);
  }
  .brand{
    font-size:20px; font-weight:800; color:#fff;
    display:flex; align-items:center; gap:10px;
    margin-bottom:6px;
  }
  .logo-img{
    width:42px; height:42px; border-radius:50%; object-fit:cover;
    box-shadow:0 0 0 2px rgba(217,169,78,0.5), 0 0 14px rgba(217,169,78,0.35);
    flex-shrink:0; background:#fff;
  }
  .logo-img-sm{ width:26px; height:26px; }
  .brand-en{ font-size:15px; line-height:1.25; }
  .sidebar-phone{ margin-top:6px; color:var(--gold-2); font-weight:700; letter-spacing:.3px; direction:ltr; text-align:right; }
  .brand-grad{
    background:linear-gradient(135deg, var(--gold-2), var(--gold) 60%, #C9862E);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    letter-spacing:.2px;
  }
  .brand .stamp-dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--gold); display:inline-block;
    box-shadow:0 0 10px 2px rgba(217,169,78,0.55);
  }
  .brand-sub{ font-size:11.5px; color:var(--muted); margin-bottom:26px; }
  .nav{ display:flex; flex-direction:column; gap:4px; flex:1; }
  .navitem{
    display:flex; align-items:center; gap:10px;
    padding:11px 12px; border-radius:10px;
    color:var(--muted); cursor:pointer; font-size:14.5px; font-weight:500;
    transition:background .15s, color .15s, transform .1s;
    border:1px solid transparent;
  }
  .navitem svg{ width:18px; height:18px; flex-shrink:0; transition:transform .15s; }
  .navitem:hover{ background:rgba(255,255,255,0.06); }
  .navitem:hover svg{ transform:scale(1.08); }
  .navitem.active{
    background:rgba(217,169,78,0.16);
    color:#fff; border-color:rgba(217,169,78,0.4);
    font-weight:700;
  }
  .sidebar-footer{ font-size:10.5px; color:var(--muted); padding-top:14px; border-top:1px solid rgba(255,255,255,0.08); }

  /* main */
  .main{ flex:1; padding:26px 30px 60px; max-width:1100px; }
  .topbar{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:22px; flex-wrap:wrap; gap:10px;}
  .tabtitle{ font-size:23px; font-weight:800; color:var(--accent); }
  .tabsub{ font-size:13px; color:var(--muted); margin-top:3px; }
  .today-chip{
    background:var(--card); border:1px solid var(--border); border-radius:999px;
    padding:6px 14px; font-size:12.5px; color:var(--muted); box-shadow:var(--shadow);
  }

  /* cards & generic */
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:18px; box-shadow:var(--shadow); margin-bottom:16px;
    transition:box-shadow .18s, transform .18s;
  }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; }
  .row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .btn{
    font-family:'Tajawal',sans-serif; font-weight:700; font-size:13.5px;
    border:none; border-radius:10px; padding:10px 16px; cursor:pointer;
    transition:.15s; display:inline-flex; align-items:center; gap:6px;
  }
  .btn-primary{ background:var(--teal-2); color:#fff; box-shadow:0 2px 8px rgba(23,50,82,0.4); }
  .btn-primary:hover{ background:#1E4470; }
  .btn-gold{ background:var(--gold); color:#0A1626; }
  .btn-gold:hover{ filter:brightness(1.08); }
  .btn-ghost{ background:transparent; color:var(--gold-2); border:1px solid var(--border); }
  .btn-ghost:hover{ background:var(--paper-2); }
  .btn-danger{ background:transparent; color:var(--absent); border:1px solid var(--absent-soft); }
  .btn-danger:hover{ background:var(--absent-soft); }
  .btn-sm{ padding:6px 10px; font-size:12px; border-radius:8px; }

  input,select{
    font-family:'Tajawal',sans-serif; font-size:13.5px;
    padding:9px 12px; border-radius:9px; border:1px solid var(--border);
    background:var(--field-bg); color:var(--ink); outline:none;
  }
  input:focus,select:focus{ border-color:var(--gold); box-shadow:0 0 0 3px rgba(217,169,78,0.15); }
  label.field-label{ font-size:12px; color:var(--muted); font-weight:700; margin-bottom:5px; display:block;}

  .empty{
    text-align:center; padding:40px 20px; color:var(--muted);
    border:1.5px dashed var(--border); border-radius:14px; font-size:13.5px;
  }

  /* group chip */
  .group-color{ width:10px; height:10px; border-radius:3px; display:inline-block; }
  .group-card{ display:flex; flex-direction:column; gap:8px; position:relative; border-inline-start-width:4px; border-inline-start-style:solid; padding-inline-start:16px; }
  .group-card:hover{ box-shadow:0 6px 18px rgba(22,56,50,0.14); transform:translateY(-2px); }
  .group-card .gname{ font-weight:800; font-size:15px; color:var(--accent); font-family:'Cairo',sans-serif;}
  .group-card .gcount{ font-size:12px; color:var(--muted); }
  .group-actions{ display:flex; gap:6px; margin-top:6px; }

  table{ width:100%; border-collapse:collapse; }
  th{ text-align:right; font-size:11.5px; color:var(--muted); font-weight:700; padding:8px 6px; border-bottom:1.5px solid var(--border); }
  td{ padding:9px 6px; border-bottom:1px solid var(--border); font-size:13.5px; }
  tr:last-child td{ border-bottom:none; }

  /* stamp buttons for attendance */
  .stamp-row{ display:flex; align-items:center; justify-content:space-between; padding:11px 4px; border-bottom:1px solid var(--border); }
  .stamp-row:last-child{ border-bottom:none; }
  .stamp-name{ font-weight:700; font-size:14px; }
  .stamps{ display:flex; gap:8px; }
  .stamp{
    width:40px; height:40px; border-radius:50%;
    border:2.5px solid var(--border); background:var(--field-bg);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:16px; color:var(--muted); font-weight:800;
    transition:.12s; transform:rotate(0deg);
  }
  .stamp:hover{ transform:scale(1.06); }
  .stamp.on-present{ background:var(--present-soft); border-color:var(--present); color:var(--present); transform:rotate(-4deg) scale(1.05); }
  .stamp.on-late{ background:var(--late-soft); border-color:var(--late); color:var(--late); transform:rotate(-4deg) scale(1.05); }
  .stamp.on-absent{ background:var(--absent-soft); border-color:var(--absent); color:var(--absent); transform:rotate(-4deg) scale(1.05); }

  .legend{ display:flex; gap:16px; font-size:12px; color:var(--muted); margin-top:10px; }
  .legend span{ display:flex; align-items:center; gap:6px; }
  .dot{ width:9px;height:9px;border-radius:50%; display:inline-block; }

  .pillbar{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .pill{
    padding:7px 14px; border-radius:999px; font-size:12.5px; font-weight:700;
    border:1px solid var(--border); background:var(--field-bg); cursor:pointer; color:var(--muted);
  }
  .pill.active{ background:var(--teal-2); color:#fff; border-color:var(--teal-2); }

  .stat{ text-align:center; padding:18px 10px; }
  .stat .stat-icon{ width:26px; height:26px; margin:0 auto 8px; color:var(--gold); opacity:.85; }
  .stat .stat-icon svg{ width:100%; height:100%; }
  .stat .num{ font-family:'Cairo',sans-serif; font-size:30px; font-weight:800; color:var(--accent); }
  .stat .lbl{ font-size:12px; color:var(--muted); margin-top:2px; }

  .hero-card{
    display:flex; align-items:center; gap:18px;
    background:linear-gradient(120deg, var(--card), var(--paper-2));
    border:1px solid var(--border); border-radius:16px;
    padding:20px 22px; margin-bottom:18px; box-shadow:var(--shadow);
    position:relative; overflow:hidden;
  }
  .hero-card::after{
    content:''; position:absolute; inset-inline-end:-40px; top:-40px;
    width:160px; height:160px; border-radius:50%;
    background:radial-gradient(circle, rgba(125,211,232,0.16), transparent 70%);
  }
  .hero-logo{
    width:64px; height:64px; border-radius:50%; object-fit:cover; flex-shrink:0;
    box-shadow:0 0 0 3px rgba(217,169,78,0.5), 0 0 20px rgba(217,169,78,0.3);
    background:#fff;
  }
  .hero-name{ font-family:'Cairo',sans-serif; font-size:20px; font-weight:800; }
  .hero-tag{ font-size:12.5px; color:var(--muted); margin-top:4px; }
  .hero-phone{ font-size:13px; color:var(--gold-2); font-weight:700; margin-top:6px; direction:ltr; text-align:right; }
  @media (max-width:520px){
    .hero-card{ flex-direction:column; text-align:center; padding:22px 16px; }
    .hero-phone,.hero-tag{ text-align:center; }
  }

  .session-item, .list-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 6px; border-bottom:1px solid var(--border); cursor:pointer;
  }
  .session-item:hover, .list-item:hover{ background:var(--paper-2); border-radius:8px; }
  .session-item:last-child, .list-item:last-child{ border-bottom:none; }
  .badge{ font-size:11px; padding:3px 9px; border-radius:999px; font-weight:700; }
  .badge-present{ background:var(--present-soft); color:var(--present); }
  .badge-late{ background:var(--late-soft); color:var(--late); }
  .badge-absent{ background:var(--absent-soft); color:var(--absent); }

  .dash-stats-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:12px; margin-bottom:16px; }
  .dash-stat{ text-align:center; padding:14px 8px; border-radius:12px; background:var(--field-bg); border:1px solid var(--border); }
  .dash-stat .num{ font-family:'Cairo',sans-serif; font-size:24px; font-weight:800; }
  .dash-stat .lbl{ font-size:11.5px; color:var(--muted); margin-top:2px; }
  .dash-stat.present .num{ color:var(--present); }
  .dash-stat.late .num{ color:var(--late); }
  .dash-stat.absent .num{ color:var(--absent); }
  .alert-item{ display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; background:var(--field-bg); margin-bottom:8px; font-size:13.5px; border-inline-start:3px solid var(--border); }
  .alert-item .alert-icon{ font-size:16px; flex-shrink:0; }
  .alert-item.red{ border-inline-start-color:var(--absent); }
  .alert-item.orange{ border-inline-start-color:var(--late); }
  .alert-item.green{ border-inline-start-color:var(--present); }
  .alert-item.yellow{ border-inline-start-color:var(--gold); }
  .dash-loading{ color:var(--muted); font-size:13px; padding:8px 0; }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(22,56,50,0.45);
    display:flex; align-items:center; justify-content:center; z-index:50; padding:16px;
  }
  .modal{
    background:var(--card); border-radius:16px; padding:22px; width:100%; max-width:400px;
    box-shadow:0 10px 40px rgba(0,0,0,0.25);
  }
  .modal h3{ font-size:17px; color:var(--accent); margin-bottom:14px; }
  .modal .field{ margin-bottom:12px; }
  .modal .field input, .modal .field select{ width:100%; }
  .modal-actions{ display:flex; gap:8px; margin-top:16px; justify-content:flex-start; }

  .swatches{ display:flex; gap:8px; }
  .swatch{ width:24px; height:24px; border-radius:7px; cursor:pointer; border:2px solid transparent; }
  .swatch.sel{ border-color:var(--gold); }

  .loading{ text-align:center; padding:60px; color:var(--muted); font-size:14px;}

  .report-head{ display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap; }
  .report-brand{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .report-brand-logo{ width:38px; height:38px; border-radius:50%; object-fit:cover; box-shadow:0 0 0 2px rgba(217,169,78,0.5); background:#fff; }
  .report-brand-name{ font-family:'Cairo',sans-serif; font-weight:800; font-size:14.5px; color:var(--gold-2); }
  .report-brand-phone{ font-size:11.5px; color:var(--muted); direction:ltr; text-align:right; }

  .booklet-card{ display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; }
  .booklet-status{ display:flex; align-items:center; gap:10px; }
  .booklet-toggle{
    width:52px; height:30px; border-radius:999px; background:var(--field-bg);
    border:1.5px solid var(--border); position:relative; cursor:pointer; transition:.2s; flex-shrink:0;
  }
  .booklet-toggle::after{
    content:''; position:absolute; top:2px; inset-inline-start:2px; width:23px; height:23px;
    border-radius:50%; background:var(--muted); transition:.2s;
  }
  .booklet-toggle.on{ background:var(--present-soft); border-color:var(--present); }
  .booklet-toggle.on::after{ background:var(--present); inset-inline-start:26px; }
  .booklet-label{ font-weight:700; font-size:14px; }
  .booklet-date{ font-size:11.5px; color:var(--muted); margin-top:2px; }

  .note-item{ padding:12px; border:1px solid var(--border); border-radius:11px; margin-bottom:10px; background:var(--paper-2); }
  .note-item-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:5px; }
  .note-date{ font-size:11px; color:var(--muted); }
  .note-text{ font-size:13.5px; line-height:1.6; }
  .note-del{ background:none; border:none; color:var(--absent); cursor:pointer; font-size:12px; }
  .note-input-row{ display:flex; gap:8px; align-items:flex-start; margin-top:12px; }
  .note-input-row textarea{
    flex:1; font-family:'Tajawal',sans-serif; font-size:13.5px; padding:10px 12px;
    border-radius:9px; border:1px solid var(--border); background:var(--field-bg); color:var(--ink);
    resize:vertical; min-height:44px; outline:none;
  }
  .note-input-row textarea:focus{ border-color:var(--gold); }
  .report-student{ font-family:'Cairo',sans-serif; font-size:20px; font-weight:800; color:var(--accent); }
  .report-meta{ font-size:12.5px; color:var(--muted); margin-top:2px; }
  .timeline{ position:relative; padding-inline-start:18px; }
  .timeline::before{ content:''; position:absolute; inset-inline-start:5px; top:4px; bottom:4px; width:2px; background:var(--border); }
  .tl-item{ position:relative; padding:8px 0 8px 0; }
  .tl-item::before{ content:''; position:absolute; inset-inline-start:-18px; top:14px; width:9px; height:9px; border-radius:50%; background:var(--accent); box-shadow:0 0 6px rgba(125,211,232,0.6); }
  .tl-item.tl-absent::before{ background:var(--absent); }
  .tl-item.tl-late::before{ background:var(--late); }
  .tl-row{ display:flex; justify-content:space-between; align-items:center; font-size:13.5px; }
  .section-title{ font-size:14px; font-weight:700; color:var(--accent); font-family:'Cairo',sans-serif; margin:20px 0 10px; display:flex; align-items:center; gap:8px; }
  .section-title:first-child{ margin-top:0; }

  .back-link{ cursor:pointer; color:var(--accent); font-size:13px; margin-bottom:12px; display:inline-flex; align-items:center; gap:4px; background:none; border:none; font-family:inherit; }
  .back-link:hover{ text-decoration:underline; }

  /* QR attendance */
  .qr-video-wrap{ position:relative; border-radius:14px; overflow:hidden; background:#000; aspect-ratio:1/1; max-height:60vh; }
  .qr-video-wrap video{ width:100%; height:100%; object-fit:cover; display:block; }
  .qr-scan-frame{ position:absolute; inset:14%; border:3px solid var(--gold); border-radius:16px; box-shadow:0 0 0 999px rgba(0,0,0,0.35); pointer-events:none; }
  .qr-status{ margin-top:10px; font-size:13px; color:var(--muted); text-align:center; min-height:18px; }
  .qr-log{ margin-top:10px; max-height:160px; overflow-y:auto; display:flex; flex-direction:column-reverse; gap:6px; }
  .qr-manual-row{ display:flex; gap:8px; margin-top:12px; }
  .qr-manual-row input{ flex:1; }
  .qr-card-modal{ text-align:center; }
  .qr-card-box{ background:#fff; border-radius:14px; padding:18px; display:inline-flex; flex-direction:column; align-items:center; gap:10px; margin:10px 0; }
  .qr-card-box .qname{ color:#0A1626; font-weight:800; font-family:'Cairo',sans-serif; font-size:15px; }
  .qr-card-box .qgroup{ color:#5B6B64; font-size:12px; }
  #qrGenTarget canvas, #qrGenTarget img{ display:block; }
  .profile-header{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .profile-avatar{ width:72px; height:72px; border-radius:50%; object-fit:cover; background:var(--field-bg); border:2px solid var(--gold); flex-shrink:0; }
  .profile-avatar-placeholder{ width:72px; height:72px; border-radius:50%; background:var(--teal-2); color:var(--gold-2); display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:800; font-family:'Cairo',sans-serif; flex-shrink:0; }
  .profile-name{ font-family:'Cairo',sans-serif; font-size:19px; font-weight:800; color:var(--ink); }
  .profile-group-badge{ font-size:12.5px; color:var(--muted); margin-top:5px; display:flex; align-items:center; gap:6px; }
  .info-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-top:16px; }
  .info-item{ background:var(--field-bg); border-radius:10px; padding:10px 12px; }
  .info-item .info-label{ font-size:11px; color:var(--muted); margin-bottom:3px; }
  .info-item .info-value{ font-size:13.5px; font-weight:700; word-break:break-word; }
  .info-item .info-value a{ color:var(--accent); text-decoration:none; }
  .photo-upload-row{ display:flex; align-items:center; gap:12px; margin-bottom:4px; }
  .photo-preview{ width:56px; height:56px; border-radius:50%; object-fit:cover; background:var(--field-bg); border:1px solid var(--border); }
  .photo-preview-placeholder{ width:56px; height:56px; border-radius:50%; background:var(--teal-2); color:var(--gold-2); display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:800; font-family:'Cairo',sans-serif; }
  .student-link{ cursor:pointer; }
  .student-link:hover{ text-decoration:underline; color:var(--accent); }
  .tl-icon{ margin-inline-end:4px; }
  @media print{
    :root{
      --ink:#22302B; --muted:#5B6B64; --paper:#fff; --paper-2:#f4f4f0;
      --card:#fff; --field-bg:#fff; --accent:#163832; --gold:#8a5f1f; --gold-2:#8a5f1f;
      --border:#ccc; --present:#2f6b4d; --late:#8a5f1f; --absent:#a6472f;
      --present-soft:#e3efe8; --late-soft:#f3e9d3; --absent-soft:#f5e0da;
    }
    .sidebar, .mobile-topbar, .topbar .btn, #reportControls, .btn{ display:none !important; }
    .main{ padding:0; max-width:100%; }
    body{ background:#fff; }
    .card{ box-shadow:none; border:1px solid #ccc; }
  }
  @media (max-width:760px){
    .app{ flex-direction:column; }
    .mobile-topbar{
      display:flex; align-items:center; gap:8px; padding:14px 18px;
      background:linear-gradient(120deg, var(--teal), var(--teal-2));
      color:#fff; font-family:'Cairo',sans-serif; font-weight:800; font-size:15.5px;
      position:sticky; top:0; z-index:30; box-shadow:0 2px 10px rgba(22,56,50,0.18);
    }
    .mobile-topbar .stamp-dot{ width:8px; height:8px; border-radius:50%; background:var(--gold); }
    .sidebar{
      position:fixed; bottom:0; inset-inline:0; top:auto; width:100%; height:auto;
      flex-direction:row; padding:6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
      box-shadow:0 -6px 18px rgba(0,0,0,0.14); z-index:40; background:linear-gradient(0deg, var(--teal), var(--teal-2));
    }
    .brand,.brand-sub,.sidebar-footer{ display:none; }
    .nav{ flex-direction:row; flex:1; justify-content:space-around; gap:2px; }
    .navitem{ flex-direction:column; gap:3px; padding:7px 2px; font-size:10px; text-align:center; border-radius:10px; flex:1; }
    .navitem svg{ width:19px; height:19px; margin:0 auto; }
    .navitem:hover svg{ transform:none; }
    .main{ padding:16px 14px calc(86px + env(safe-area-inset-bottom, 0px)); max-width:100%; }
    .topbar{ align-items:flex-start; }
  }
</style>

// ---------- storage helpers (Firestore) ----------
async function sGet(key){
  try{
    const doc = await db.collection('app_data').doc(key).get();
    if(!doc.exists) return null;
    const data = doc.data();
    return (data && data.value !== undefined) ? JSON.parse(data.value) : null;
  }catch(e){ console.error(e); return null; }
}
async function sSet(key, value){
  try{
    await db.collection('app_data').doc(key).set({ value: JSON.stringify(value), updatedAt: Date.now() });
    return true;
  }catch(e){ console.error(e); alert('حصلت مشكلة في الحفظ، تأكد من اتصال الإنترنت وحاول تاني'); return false; }
}
async function sList(prefix){
  try{
    const snap = await db.collection('app_data').get();
    return snap.docs.map(d=>d.id).filter(k=>!prefix || k.startsWith(prefix));
  }catch(e){ return []; }
}
async function sDelete(key){
  try{ await db.collection('app_data').doc(key).delete(); return true; }
  catch(e){ console.error(e); return false; }
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function todayStr(){ const d=new Date(); return d.toISOString().slice(0,10); }
function fmtDate(s){
  const d = new Date(s+'T00:00:00');
  return d.toLocaleDateString('ar-EG',{weekday:'short', day:'numeric', month:'short'});
}

// ---------- state ----------
let state = {
  tab:'home',
  groups: [],
  students: [],
  assessments: [],
  homeworkList: [],
  loaded:false
};

async function loadCore(){
  state.groups = (await sGet('groups')) || [];
  state.students = (await sGet('students')) || [];
  state.assessments = (await sGet('assessments')) || [];
  state.homeworkList = (await sGet('homeworkList')) || [];
  state.loaded = true;
}

function studentsOf(groupId){ return state.students.filter(s=>s.groupId===groupId); }
function groupName(id){ const g=state.groups.find(g=>g.id===id); return g? g.name : '—'; }
function groupColor(id){ const g=state.groups.find(g=>g.id===id); return g? g.color : '#999'; }

// ================= HOME / DASHBOARD =================
async function computeDashboardData(){
  const today = todayStr();
  let presentToday=0, lateToday=0, absentToday=0, markedGroupsToday=0;
  const alerts = [];
  let bestGroup = null, bestGroupPct = -1;

  for(const g of state.groups){
    const groupStudents = studentsOf(g.id);
    if(groupStudents.length===0) continue;

    // today's attendance tally
    const todayRec = await sGet(`attendance:${g.id}:${today}`);
    if(todayRec){
      markedGroupsToday++;
      groupStudents.forEach(s=>{
        const st = todayRec[s.id];
        if(st==='present') presentToday++;
        else if(st==='late') lateToday++;
        else if(st==='absent') absentToday++;
      });
    }

    // scan all recorded sessions for this group
    const keys = await sList(`attendance:${g.id}:`);
    const dates = keys.map(k=>k.split(':')[2]).filter(Boolean).sort();
    if(dates.length>0){
      const records = {};
      for(const d of dates){ records[d] = (await sGet(`attendance:${g.id}:${d}`)) || {}; }

      let totalMarks=0, presentMarks=0;
      groupStudents.forEach(s=>{
        dates.forEach(d=>{
          const st = records[d][s.id];
          if(st){ totalMarks++; if(st==='present'||st==='late') presentMarks++; }
        });
      });
      if(totalMarks>0){
        const pct = Math.round((presentMarks/totalMarks)*100);
        if(pct>bestGroupPct){ bestGroupPct=pct; bestGroup=g.name; }
      }

      // students absent in the last two recorded sessions of this group
      const lastTwo = dates.slice(-2);
      if(lastTwo.length===2){
        groupStudents.forEach(s=>{
          const st1 = records[lastTwo[0]][s.id];
          const st2 = records[lastTwo[1]][s.id];
          if(st1==='absent' && st2==='absent'){
            alerts.push({level:'red', icon:'🔴', text:`${s.name} غاب آخر حصتين على التوالي (${g.name})`});
          }
        });
      }
    }
  }

  if(bestGroup){
    alerts.push({level:'green', icon:'🟢', text:`أعلى نسبة حضور: ${bestGroup} (${bestGroupPct}%)`});
  }
  if(state.groups.length>0 && markedGroupsToday===0){
    alerts.push({level:'yellow', icon:'🟡', text:'لسه محدش سجل حضور النهاردة'});
  }

  return { presentToday, lateToday, absentToday, markedGroupsToday, alerts };
}

// ================= STUDENT QR CODES =================
function qrTextFor(student){ return `TNB-STU:${student.id}`; }

// Renders a QR code into a plain (non-attached) div and resolves with its dataURL.
function renderQrDataUrl(text){
  return new Promise((resolve)=>{
    const tmp = document.createElement('div');
    tmp.style.position='fixed'; tmp.style.left='-9999px'; tmp.style.top='-9999px';
    document.body.appendChild(tmp);
    try{
      new QRCode(tmp, { text, width:220, height:220, colorDark:'#0A1626', colorLight:'#ffffff', correctLevel: QRCode.CorrectLevel.M });
    }catch(e){ document.body.removeChild(tmp); resolve(null); return; }
    setTimeout(()=>{
      const canvas = tmp.querySelector('canvas');
      const img = tmp.querySelector('img');
      let dataUrl = null;
      if(canvas) dataUrl = canvas.toDataURL('image/png');
      else if(img) dataUrl = img.src;
      document.body.removeChild(tmp);
      resolve(dataUrl);
    }, 60);
  });
}

async function printQrCards(list){
  if(!list || list.length===0){ alert('مفيش طلاب في القائمة دي.'); return; }
  const cards = [];
  for(const s of list){
    const dataUrl = await renderQrDataUrl(qrTextFor(s));
    if(dataUrl) cards.push({ student:s, dataUrl });
  }
  if(cards.length===0){ alert('تعذّر توليد أكواد QR.'); return; }
  const win = window.open('', '_blank');
  if(!win){ alert('برجاء السماح بالنوافذ المنبثقة لطباعة البطاقات.'); return; }
  win.document.write(`
    <!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8">
    <title>بطاقات QR</title>
    <style>
      body{ font-family: Tahoma, Arial, sans-serif; margin:20px; }
      .grid{ display:flex; flex-wrap:wrap; gap:14px; }

let profileState = { studentId: null };

async function computeProfileData(student){
  const photo = await sGet(`photo:${student.id}`);
  const booklet = (await sGet(`booklet:${student.id}`)) || { paid:false, date:null };
  const notes = (await sGet(`notes:${student.id}`)) || [];

  // attendance across all sessions of the student's group
  const attKeys = await sList(`attendance:${student.groupId}:`);
  const dates = attKeys.map(k=>k.split(':')[2]).filter(Boolean).sort();
  const attRecords = await Promise.all(dates.map(async d=>({date:d, rec:(await sGet(`attendance:${student.groupId}:${d}`))||{}})));
  const attHistory = attRecords
    .filter(x=>x.rec.hasOwnProperty(student.id))
    .map(x=>({date:x.date, status:x.rec[student.id]}));
  const totalSessions = dates.length;
  const pCount = attHistory.filter(x=>x.status==='present').length;
  const lCount = attHistory.filter(x=>x.status==='late').length;
  const attRate = totalSessions>0 ? Math.round(((pCount+lCount)/totalSessions)*100) : null;

  // grades across all assessments of the group
  const groupAssessments = state.assessments.filter(a=>a.groupId===student.groupId).sort((a,b)=>a.date.localeCompare(b.date));
  const gradeRows = await Promise.all(groupAssessments.map(async a=>{
    const scores = (await sGet(`scores:${a.id}`)) || {};
    return {title:a.title, date:a.date, maxScore:a.maxScore, score: scores.hasOwnProperty(student.id)? scores[student.id] : null};
  }));
  const gradedRows = gradeRows.filter(r=>r.score!==null);
  const avgPct = gradedRows.length? Math.round(gradedRows.reduce((s,r)=>s+(r.score/r.maxScore*100),0)/gradedRows.length) : null;

  // homework across all homework items of the group
  const groupHw = state.homeworkList.filter(h=>h.groupId===student.groupId).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
  const hwRows = await Promise.all(groupHw.map(async h=>{
    const status = (await sGet(`hwStatus:${h.id}`)) || {};
    return {title:h.title, dueDate:h.dueDate, done: !!status[student.id]};
  }));
  const hwDoneCount = hwRows.filter(r=>r.done).length;
  const hwRate = groupHw.length? Math.round((hwDoneCount/groupHw.length)*100) : null;

  // merged timeline
  const timeline = [];
  attHistory.forEach(x=>timeline.push({
    date:x.date,
    icon: x.status==='present'?'✔️':x.status==='late'?'⏰':'❌',
    text: x.status==='present'?'حضر الحصة':x.status==='late'?'حضر متأخر':'غاب عن الحصة',
    cls: x.status==='absent'?'tl-absent':x.status==='late'?'tl-late':''
  }));
  gradeRows.filter(r=>r.score!==null).forEach(r=>timeline.push({
    date:r.date, icon:'📊', text:`درجة ${r.title}: ${r.score}/${r.maxScore}`, cls:''
  }));
  hwRows.filter(r=>r.done).forEach(r=>timeline.push({
    date:r.dueDate, icon:'📝', text:`سلّم واجب: ${r.title}`, cls:''
  }));
  if(booklet.paid && booklet.date){
    timeline.push({date:booklet.date, icon:'📘', text:'دفع/استلم المذكرة', cls:''});
  }
  notes.forEach(n=>timeline.push({date:n.date, icon:'🗒️', text:n.text, cls:''}));
  timeline.sort((a,b)=>b.date.localeCompare(a.date));

  return { photo, booklet, notes, attHistory, totalSessions, attRate, groupAssessments, gradeRows, avgPct, groupHw, hwRate, timeline };
}

async function renderSessionHistory(){
  const div = document.getElementById('sessionHistory');
  const keys = await sList(`attendance:${attState.groupId}:`);
  if(keys.length===0){ div.innerHTML = `<div class="empty">مفيش جلسات مسجلة لسه لهذه المجموعة.</div>`; return; }
  const dates = keys.map(k=>k.split(':')[2]).sort().reverse().slice(0,10);
  const rows = await Promise.all(dates.map(async d=>{
    const rec = (await sGet(`attendance:${attState.groupId}:${d}`)) || {};
    const vals = Object.values(rec);
    const p = vals.filter(v=>v==='present').length;
    const l = vals.filter(v=>v==='late').length;

      document.getElementById('attDate').value = attState.date;
      await loadAttSession();
      renderAttCard();
    });
  });
}

// ================= QR ATTENDANCE SCAN =================
let qrScanStream = null, qrScanning = false, qrLastHits = {};

async function openQrScanModal(){
  const overlay = document.createElement('div');
  overlay.className='modal-overlay';
  overlay.id = 'qrScanOverlay';
  overlay.innerHTML = `
    <div class="modal" style="max-width:420px;">
      <h3>📷 تسجيل حضور بمسح QR</h3>
      <div class="qr-video-wrap">
        <video id="qrVideo" playsinline autoplay muted></video>
        <div class="qr-scan-frame"></div>
      </div>
      <canvas id="qrCanvas" style="display:none;"></canvas>
      <div class="qr-status" id="qrStatus">جارِ تشغيل الكاميرا...</div>
      <div class="qr-log" id="qrScanLog"></div>
      <div class="qr-manual-row">
        <input id="qrManualInput" placeholder="أو أدخل كود الطالب يدويًا">
        <button class="btn btn-ghost btn-sm" id="qrManualBtn">تسجيل</button>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="qrCloseBtn">إغلاق</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  qrLastHits = {};

  overlay.querySelector('#qrCloseBtn').addEventListener('click', closeQrScanModal);
  overlay.addEventListener('click',(e)=>{ if(e.target===overlay) closeQrScanModal(); });
  overlay.querySelector('#qrManualBtn').addEventListener('click', ()=>{
    const input = document.getElementById('qrManualInput');
    const val = input.value.trim();
    if(val){ processQrText(val); input.value=''; }
  });
  overlay.querySelector('#qrManualInput').addEventListener('keydown',(e)=>{
    if(e.key==='Enter'){ e.preventDefault(); document.getElementById('qrManualBtn').click(); }
  });

  const statusEl = document.getElementById('qrStatus');
  const video = document.getElementById('qrVideo');
  try{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      throw new Error('no-camera-api');
    }
    qrScanStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' }, audio:false });
    video.srcObject = qrScanStream;
    await video.play();
    qrScanning = true;
    statusEl.textContent = 'وجّه الكاميرا لكود QR بطاقة الطالب...';
    requestAnimationFrame(qrScanTick);
  }catch(err){
    statusEl.textContent = 'تعذّر تشغيل الكاميرا. استخدم الإدخال اليدوي بالأسفل، أو اسمح للمتصفح بالوصول للكاميرا.';
  }
}

function qrScanTick(){
  if(!qrScanning) return;
  const video = document.getElementById('qrVideo');
  const canvas = document.getElementById('qrCanvas');
  if(video && canvas && video.readyState === video.HAVE_ENOUGH_DATA && window.jsQR){
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    try{
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imgData.data, imgData.width, imgData.height);
      if(code && code.data) processQrText(code.data);
    }catch(e){ /* ignore transient decode errors */ }
  }
  if(qrScanning) requestAnimationFrame(qrScanTick);
}

function closeQrScanModal(){
  qrScanning = false;
  if(qrScanStream){ qrScanStream.getTracks().forEach(t=>t.stop()); qrScanStream = null; }
  const overlay = document.getElementById('qrScanOverlay');
  if(overlay) overlay.remove();
}

function qrLogEntry(cls, icon, text){
  const logEl = document.getElementById('qrScanLog');
  if(!logEl) return;
  const div = document.createElement('div');
  div.className = `alert-item ${cls}`;
  div.innerHTML = `<span class="alert-icon">${icon}</span><span>${text.replace(/</g,'&lt;')}</span>`;
  logEl.prepend(div);
  while(logEl.children.length > 12) logEl.removeChild(logEl.lastChild);
}

async function processQrText(rawText){
  const text = (rawText||'').trim();
  if(!text) return;
  const now = Date.now();
  if(qrLastHits[text] && (now - qrLastHits[text]) < 2500) return; // debounce repeated frames
  qrLastHits[text] = now;

  const m = /^TNB-STU:(.+)$/.exec(text);
  const id = m ? m[1] : text;
  const student = state.students.find(s=>s.id===id);
  const statusEl = document.getElementById('qrStatus');

  if(!student){
    if(statusEl) statusEl.textContent = 'كود QR غير معروف، جرّب تاني.';
    qrLogEntry('red', '✕', 'كود غير معروف');
    return;
  }
  if(student.groupId !== attState.groupId){
    if(statusEl) statusEl.textContent = `${student.name} مش في المجموعة المختارة.`;
    qrLogEntry('orange', '⚠️', `${student.name} من مجموعة "${groupName(student.groupId)}"`);
    return;
  }

  const alreadyPresent = attState.records[student.id] === 'present';
  attState.records[student.id] = 'present';
  const key = `attendance:${attState.groupId}:${attState.date}`;
  await sSet(key, attState.records);

  if(statusEl) statusEl.textContent = `✓ ${student.name}`;
  qrLogEntry('green', '✔️', alreadyPresent ? `${student.name} (مسجل بالفعل)` : student.name);

  if(document.getElementById('attCard')) await renderAttCard();
  if(document.getElementById('sessionHistory')) await renderSessionHistory();
}

        <button class="btn btn-danger btn-sm" data-del="${a.id}">حذف</button>
      </div>
    </div>`).join('');
  list.forEach(async a=>{
    const scores = (await sGet(`scores:${a.id}`)) || {};
    const vals = Object.values(scores).filter(v=>v!==null && v!==undefined && v!=='');
    const el = document.getElementById(`avg-${a.id}`);
    if(el) el.textContent = vals.length? `متوسط ${(vals.reduce((x,y)=>x+Number(y),0)/vals.length).toFixed(1)}` : 'لسه مافيش درجات';
  });
  div.querySelectorAll('.list-item').forEach(el=>{
    el.addEventListener('click',(e)=>{
      if(e.target.dataset.del) return;
      gradesState.openAssessment = el.dataset.id;
      renderMain();
    });
  });
  div.querySelectorAll('[data-del]').forEach(b=>{
    b.addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(!confirm('حذف التقييم ده وكل درجاته؟')) return;
      state.assessments = state.assessments.filter(a=>a.id!==b.dataset.del);
      await sSet('assessments', state.assessments);
      if(gradesState.openAssessment===b.dataset.del) gradesState.openAssessment=null;
      renderMain();
    });
  });
}

async function buildReportBody(){
  const body = document.getElementById('reportBody');
  const student = state.students.find(s=>s.id===reportState.studentId);
  if(!student){ body.innerHTML = `<div class="empty">اختار طالب.</div>`; return; }

  // attendance across all sessions of the student's group
  const attKeys = await sList(`attendance:${student.groupId}:`);
  const dates = attKeys.map(k=>k.split(':')[2]).sort();
  const attRecords = await Promise.all(dates.map(async d=>({date:d, rec:(await sGet(`attendance:${student.groupId}:${d}`))||{}})));
  const attHistory = attRecords
    .filter(x=>x.rec.hasOwnProperty(student.id))
    .map(x=>({date:x.date, status:x.rec[student.id]}));
  const totalSessions = dates.length;
  const pCount = attHistory.filter(x=>x.status==='present').length;
  const lCount = attHistory.filter(x=>x.status==='late').length;
  const aCount = attHistory.filter(x=>x.status==='absent').length;
  const attRate = totalSessions>0 ? Math.round(((pCount+lCount)/totalSessions)*100) : null;

  // grades across all assessments of the group
  const groupAssessments = state.assessments.filter(a=>a.groupId===student.groupId).sort((a,b)=>a.date.localeCompare(b.date));
  const gradeRows = await Promise.all(groupAssessments.map(async a=>{
    const scores = (await sGet(`scores:${a.id}`)) || {};
    return {title:a.title, date:a.date, maxScore:a.maxScore, score: scores.hasOwnProperty(student.id)? scores[student.id] : null};
  }));
  const gradedRows = gradeRows.filter(r=>r.score!==null);
  const avgPct = gradedRows.length? Math.round(gradedRows.reduce((s,r)=>s+(r.score/r.maxScore*100),0)/gradedRows.length) : null;

  // homework across all homework items of the group
  const groupHw = state.homeworkList.filter(h=>h.groupId===student.groupId).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
  const hwRows = await Promise.all(groupHw.map(async h=>{
    const status = (await sGet(`hwStatus:${h.id}`)) || {};
    return {title:h.title, dueDate:h.dueDate, done: !!status[student.id]};
  }));
  const hwDoneCount = hwRows.filter(r=>r.done).length;
  const hwRate = groupHw.length? Math.round((hwDoneCount/groupHw.length)*100) : null;

  if(document.getElementById('repStudent')?.value !== student.id) return; // stale render guard

  body.innerHTML = `
    <div class="report-brand">
      <img src="${LOGO_URI}" class="report-brand-logo" alt="Tarek Nour Biology">
      <div>
        <div class="report-brand-name">Tarek Nour Biology</div>
        <div class="report-brand-phone">📞 01202697906</div>
      </div>
    </div>
    <div class="card">
      <div class="report-head">
        <div>
          <div class="report-student">${student.name}</div>
          <div class="report-meta"><span class="group-color" style="background:${groupColor(student.groupId)}"></span> ${groupName(student.groupId)}</div>
        </div>
      </div>
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); margin-top:16px;">
        <div class="stat"><div class="num">${attRate!==null? attRate+'%':'—'}</div><div class="lbl">نسبة الحضور</div></div>
        <div class="stat"><div class="num">${avgPct!==null? avgPct+'%':'—'}</div><div class="lbl">متوسط الدرجات</div></div>
        <div class="stat"><div class="num">${hwRate!==null? hwRate+'%':'—'}</div><div class="lbl">تسليم الواجبات</div></div>
        <div class="stat"><div class="num">${totalSessions}</div><div class="lbl">إجمالي الحصص</div></div>
      </div>
    </div>

    <div class="card">
      <div class="section-title"><span style="width:16px;height:16px;display:inline-flex;">${ICONS.attendance}</span> سجل الحضور (${attHistory.length} من ${totalSessions})</div>
      ${attHistory.length===0? `<div class="empty">مفيش سجل حضور لهذا الطالب لسه.</div>` : `
      <div class="timeline">
        ${attHistory.slice().reverse().map(x=>`
          <div class="tl-item ${x.status==='absent'?'tl-absent':x.status==='late'?'tl-late':''}">
            <div class="tl-row">
              <span>${fmtDate(x.date)}</span>
              <span class="badge ${x.status==='present'?'badge-present':x.status==='late'?'badge-late':'badge-absent'}">${x.status==='present'?'حاضر':x.status==='late'?'متأخر':'غائب'}</span>
            </div>
          </div>`).join('')}
      </div>`}
    </div>

    <div class="card">
      <div class="section-title">📊 الدرجات (${gradedRows.length} من ${groupAssessments.length})</div>
      ${groupAssessments.length===0? `<div class="empty">لسه مفيش تقييمات مسجلة لهذه المجموعة.</div>` : `
      <table>
        <thead><tr><th>التقييم</th><th>التاريخ</th><th>الدرجة</th></tr></thead>
        <tbody>
          ${gradeRows.map(r=>`<tr>
            <td style="font-weight:700;">${r.title}</td>
            <td>${fmtDate(r.date)}</td>
            <td>${r.score!==null? `${r.score} / ${r.maxScore}` : `<span style="color:var(--muted);">لم تُرصد</span>`}</td>
          </tr>`).join('')}
        </tbody>
      </table>`}
    </div>

    <div class="card">
      <div class="section-title">📝 الواجبات (${hwDoneCount} من ${groupHw.length})</div>
      ${groupHw.length===0? `<div class="empty">لسه مفيش واجبات مسجلة لهذه المجموعة.</div>` : `
      <table>
        <thead><tr><th>الواجب</th><th>تاريخ التسليم</th><th>الحالة</th></tr></thead>
        <tbody>
          ${hwRows.map(r=>`<tr>
            <td style="font-weight:700;">${r.title}</td>
            <td>${fmtDate(r.dueDate)}</td>
            <td><span class="badge ${r.done?'badge-present':'badge-absent'}">${r.done?'سلّم':'لم يسلّم'}</span></td>
          </tr>`).join('')}
        </tbody>
      </table>`}
    </div>
  `;
}

    </div>
    <div class="note-input-row">
      <textarea id="newNoteText" placeholder="اكتب ملاحظة، مثال: اتكلمنا مع ولي الأمر بخصوص الغياب..."></textarea>
      <button class="btn btn-primary" id="addNoteBtn">إضافة</button>
    </div>
  `;
  card.querySelectorAll('.note-del').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const updated = notes.filter(n=>n.id!==b.dataset.id);
      await sSet(`notes:${notesState.studentId}`, updated);
      renderNotesCard();
    });
  });
  document.getElementById('addNoteBtn').addEventListener('click', async ()=>{
    const text = document.getElementById('newNoteText').value.trim();
    if(!text) return;
    notes.push({ id: uid(), date: todayStr(), text });
    await sSet(`notes:${notesState.studentId}`, notes);
    renderNotesCard();
  });
}

// ---------- login gate ----------
function showLoginScreen(errorMsg){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div style="min-height:100vh; width:100%; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:18px; padding:20px;">
      <img src="${LOGO_URI}" style="width:72px;height:72px;border-radius:50%;box-shadow:0 0 0 2px rgba(217,169,78,0.5), 0 0 18px rgba(217,169,78,0.35);" alt="Tarek Nour Biology">
      <div class="brand-grad" style="font-size:22px;font-weight:800;font-family:'Cairo',sans-serif;">Tarek Nour Biology</div>
      <form id="loginForm" class="card" style="width:100%; max-width:320px; display:flex; flex-direction:column; gap:12px;">
        <div>
          <label class="field-label">كلمة السر</label>
          <input type="password" id="loginPass" required style="width:100%;" autofocus>
        </div>
        <div id="loginError" style="color:var(--absent); font-size:12.5px; min-height:16px;">${errorMsg||''}</div>
        <button type="submit" class="btn btn-gold" style="width:100%; justify-content:center;">دخول</button>
      </form>
    </div>
  `;
  document.getElementById('loginForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const pass = document.getElementById('loginPass').value;
    const btn = e.target.querySelector('button');
    btn.disabled = true; btn.textContent = 'بيدخل...';
    try{
      await auth.signInWithEmailAndPassword(TEACHER_EMAIL, pass);
    }catch(err){
      showLoginScreen('كلمة السر غلط أو حصلت مشكلة، حاول تاني');
    }
  });
}

function logout(){
  auth.signOut();
}

// ---------- boot ----------
auth.onAuthStateChanged(async (user)=>{
  if(user){
    await loadCore();
    render();
  } else {
    showLoginScreen();
  }
});
</script>
</body>
</html>
